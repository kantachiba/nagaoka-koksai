# wrangler CLI でデプロイする場合の設定。
# ダッシュボードから直接貼り付ける場合は不要（README.md のA案を参照）。
#
# 使い方：
#   cd cloudflare
#   npx wrangler login
#   npx wrangler deploy

# ダッシュボードで最初に作ったときの自動命名。ルートがこの Worker に
# 割り当て済みなので、別名にすると deploy がルートの競合で失敗する。
name = "autumn-sky-fb61"
main = "international-portal-proxy.js"
compatibility_date = "2026-09-01"

# tibanian.com は Cloudflare でゾーンを管理している前提。
# ルートは「厳密一致」と「配下すべて」の2本を登録する
# （/international-portal だけだと末尾スラッシュなしの直アクセスが
# 　ルーティングされない場合があるため）。
routes = [
  { pattern = "tibanian.com/international-portal", zone_name = "tibanian.com" },
  { pattern = "tibanian.com/international-portal/*", zone_name = "tibanian.com" },
]
